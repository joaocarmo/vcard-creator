name: Publish

on:
  workflow_dispatch:

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'main'
          persist-credentials: false

      # No cache: a restored store could inject poisoned packages into the release
      - name: Set up pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish
