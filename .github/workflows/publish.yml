name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  publish-npm:
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for npm trusted publishing (OIDC)
      contents: read

    steps:
      # Checks out the commit the release tag points to, with the history of
      # main for the check below
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The release tag must point to a commit on main"
            exit 1
          fi

      # No cache: a restored store could inject poisoned packages into the release
      - name: Set up pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      - name: Set the version from the release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: pnpm version:set "$TAG_NAME"

      - name: Build
        run: pnpm build

      # Consumers do not need the Git hooks
      - name: Remove the prepare script
        run: pnpm pkg delete scripts.prepare

      # The checkout is a detached HEAD with the version change uncommitted
      - name: Publish to npm
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: pnpm publish --no-git-checks --tag "$DIST_TAG"
