name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint the source files
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Check formatting
        run: pnpm pretty

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the library
        run: pnpm build

      - name: Execute the tests
        run: |
          pnpm test:coverage
          pnpm test:functional

  smoke:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # TODO(#156): remove 18 when the minimum Node.js version becomes 20.
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the library
        run: pnpm build

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      # Calls node directly: pnpm may not run on the older Node.js
      - name: Run the smoke test against dist/
        run: node test/smoke/node.mjs
        env:
          NODE_MAJOR: ${{ matrix.node-version }}
