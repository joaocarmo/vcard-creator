name: Release Version

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_PAT }}
          ref: 'main'

      - name: Bump the version
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          git config --local user.name "$GIT_AUTHOR_NAME"
          git config --local user.email "$GIT_AUTHOR_EMAIL"
          npm version --no-commit-hooks --no-git-tag-version "$TAG_NAME"

      - name: Sync LIB_VERSION constant
        run: node scripts/sync-version.mjs

      - name: Commit and push the version change
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          git add .
          git commit -m "Release $TAG_NAME" --no-gpg-sign --no-verify --signoff
          git push

      - name: Trigger the Publish workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh workflow run publish.yml --ref main
